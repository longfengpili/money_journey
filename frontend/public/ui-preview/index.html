<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Money Journey · 总览视觉提案</title>
    <style>
      :root { font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; font-synthesis: none; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, a { font: inherit; }
      a { text-decoration: none; }
      .preview-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px max(20px, calc((100vw - 1360px) / 2)); background: #10131e; color: #f6f7ff; border-bottom: 1px solid #ffffff24; }
      .preview-bar strong { letter-spacing: .05em; }
      .preview-bar small { color: #aeb4ca; }
      .preview-links { display: flex; flex-wrap: wrap; gap: 7px; }
      .preview-links a { padding: 8px 13px; border-radius: 999px; color: #c8cee2; background: #ffffff12; font-size: 12px; }
      .preview-links a.active { color: #111526; background: #ecf2ff; }
      .preview-links a:hover { background: #ffffff30; color: white; }
      .preview-links a.active:hover { color: #111526; background: white; }
      .preview-note { font-size: 11px; color: #aeb4ca; }
      .concept { --bg: #0a1020; --surface: #111b2d; --surface2: #15243b; --text: #f7f9ff; --muted: #a4b5cb; --line: #ffffff1c; --accent: #7f8dff; min-height: calc(100vh - 61px); background: var(--bg); color: var(--text); overflow: hidden; }
      .frame { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: calc(100vh - 61px); }
      .side { padding: 32px 17px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 32px; }
      .logo { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.04em; font-size: 15px; }
      .mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--accent); color: #0a1020; box-shadow: 0 0 24px color-mix(in srgb, var(--accent), transparent 45%); }
      .side nav { display: grid; gap: 7px; }
      .side nav span { padding: 11px 13px; border-radius: 11px; color: var(--muted); font-size: 13px; }
      .side nav .active { background: color-mix(in srgb, var(--accent), transparent 82%); color: var(--text); }
      .side-foot { margin-top: auto; padding: 14px 12px; border: 1px solid var(--line); border-radius: 13px; font-size: 11px; color: var(--muted); }
      .main { min-width: 0; padding: 28px 34px 48px; }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
      .eyebrow { font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
      .top h1 { font-size: clamp(25px, 3vw, 36px); margin: 5px 0 0; letter-spacing: -.05em; }
      .top-right { display: flex; align-items: center; gap: 10px; }
      .pill { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; white-space: nowrap; }
      .avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--bg); font-size: 11px; font-weight: 800; }
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; min-width: 0; }
      .panel-pad { padding: 22px; }
      .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
      .panel-head h2 { margin: 0; font-size: 16px; letter-spacing: -.025em; }
      .panel-head span { color: var(--muted); font-size: 11px; }
      .kpi { font-size: clamp(38px, 5vw, 66px); letter-spacing: -.065em; line-height: 1.12; font-weight: 750; white-space: nowrap; }
      .kpi small { font-size: .45em; vertical-align: 15%; margin-right: 5px; }
      .sub { color: var(--muted); font-size: 12px; }
      .metric-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
      .metric { padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface2); }
      .metric span { display: block; color: var(--muted); font-size: 11px; }
      .metric strong { display: block; font-size: 20px; margin-top: 5px; letter-spacing: -.035em; }
      .grid-main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, 1fr); gap: 16px; margin-bottom: 16px; }
      .grid-bottom { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .chart-svg { display: block; width: 100%; height: auto; }
      .chart-axis { fill: var(--muted); font-size: 10px; }
      .legend { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 14px; color: var(--muted); font-size: 11px; }
      .dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--accent); }
      .rank { display: grid; gap: 15px; }
      .rank-item { display: grid; grid-template-columns: 85px 1fr auto; gap: 10px; align-items: center; font-size: 11px; }
      .rank-item span:first-child { color: var(--muted); }
      .rank-item strong { font-size: 12px; }
      .track { height: 7px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--accent), transparent 88%); }
      .fill { height: 100%; border-radius: inherit; background: var(--accent); }
      .donut { width: 152px; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(var(--accent) 0 45%, var(--accent2, #56d7de) 45% 76%, var(--accent3, #f7bd72) 76% 100%); display: grid; place-items: center; margin: 4px auto 13px; }
      .donut::after { content: "3 类资产"; width: 101px; aspect-ratio: 1; background: var(--surface); border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: var(--muted); }
      .maturity { display: flex; align-items: end; justify-content: space-between; height: 150px; gap: 10px; padding: 8px 3px 0; }
      .maturity div { flex: 1; text-align: center; min-width: 0; }
      .maturity i { display: block; height: var(--h); max-width: 40px; margin: 0 auto 7px; border-radius: 8px 8px 2px 2px; background: linear-gradient(0deg, var(--accent), var(--accent2, #60d9ef)); }
      .maturity small { font-size: 10px; color: var(--muted); }
      .member-list { display: grid; gap: 13px; }
      .member { display: flex; align-items: center; gap: 9px; font-size: 11px; }
      .member b { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--accent), transparent 74%); }
      .member span { margin-left: auto; font-weight: 700; }
      .member-strip { display: flex; overflow: hidden; height: 9px; border-radius: 99px; margin-top: 20px; }
      .member-strip i:nth-child(1) { width: 45%; background: var(--accent); }
      .member-strip i:nth-child(2) { width: 35%; background: var(--accent2, #56d7de); }
      .member-strip i:nth-child(3) { width: 20%; background: var(--accent3, #f7bd72); }
      .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding: 13px 18px; border-radius: 13px; background: color-mix(in srgb, var(--accent), transparent 88%); color: var(--text); font-size: 11px; }
      .banner strong { font-size: 12px; }
      .banner a { color: var(--text); border-bottom: 1px solid currentColor; }
      .orbit { --bg: #080d19; --surface: #111a2b; --surface2: #172139; --accent: #9b86ff; --accent2: #45d8e7; --accent3: #ffb66b; background: radial-gradient(circle at 67% -16%, #35255e 0, transparent 45%), var(--bg); }
      .orbit .hero { position: relative; overflow: hidden; padding: 32px; min-height: 279px; background: radial-gradient(circle at 83% 37%, #664de750, transparent 32%), linear-gradient(115deg, #152644, #121b35 65%, #191a35); border: 1px solid #8b82ec55; }
      .orbit .hero::after { content: ""; position: absolute; width: 310px; height: 310px; border-radius: 50%; right: -50px; top: -70px; border: 1px solid #ffffff30; box-shadow: inset 0 0 70px #6d4ced35, 0 0 0 45px #a19aff0b, 0 0 0 91px #a19aff09; pointer-events: none; }
      .orbit .hero > * { position: relative; z-index: 1; }
      .orbit .hero .kpi { margin: 18px 0 7px; text-shadow: 0 0 34px #a89af355; }
      .orbit .hero .sub { color: #c9c9e5; }
      .orbit .grid-main { margin-top: 16px; }
      .orbit .chart-line { stroke: #8e84ff; filter: drop-shadow(0 5px 10px #7169ff80); }
      .glass { --bg: #e5eefc; --surface: #ffffffa8; --surface2: #ffffff9c; --text: #172541; --muted: #64718f; --line: #ffffffc9; --accent: #6a68e8; --accent2: #2ccbbb; --accent3: #ffad6f; background: radial-gradient(circle at 20% 0, #a4dafa 0, transparent 28%), radial-gradient(circle at 97% 21%, #d7b3ff 0, transparent 36%), linear-gradient(135deg, #e5efff, #f2e9ff 64%, #d8f4ed); }
      .glass .side { background: #ffffff50; backdrop-filter: blur(22px); }
      .glass .panel { box-shadow: 0 12px 35px #6c82ab1c; backdrop-filter: blur(20px); }
      .glass .hero { padding: 31px; background: radial-gradient(circle at 75% 55%, #a3c7ff 0, transparent 30%), linear-gradient(110deg, #ffffffd1, #f4edffbb); }
      .glass .hero .kpi { color: #2d3c73; margin: 22px 0 8px; }
      .glass .mark { color: white; }
      .glass .donut::after { background: #f8f9ff; }
      .glass .chart-line { stroke: #6966e8; }
      .editorial { --bg: #f4f1ea; --surface: #fffefa; --surface2: #f6f3ec; --text: #20201d; --muted: #77746b; --line: #dedbd1; --accent: #ff5a36; --accent2: #22211e; --accent3: #f2b84f; }
      .editorial .side { background: #eeeae1; }
      .editorial .mark { border-radius: 2px; color: #fff; box-shadow: none; }
      .editorial .panel { border-radius: 3px; }
      .editorial .metric { border-radius: 2px; }
      .editorial .top h1 { font-size: clamp(30px, 4vw, 51px); font-weight: 900; }
      .editorial .hero { display: grid; grid-template-columns: 1.15fr .85fr; padding: 0; overflow: hidden; background: #20201d; color: #fff9ec; }
      .editorial .hero-copy { padding: 31px; }
      .editorial .hero .eyebrow { color: #ff9c82; }
      .editorial .hero .kpi { margin: 22px 0 11px; font-size: clamp(37px, 4.5vw, 63px); }
      .editorial .hero-graphic { display: grid; align-content: center; padding: 25px; background: var(--accent); color: #21110b; }
      .editorial .hero-graphic span { font-size: 10px; font-weight: 800; letter-spacing: .12em; }
      .editorial .hero-graphic strong { font-size: clamp(58px, 8vw, 120px); letter-spacing: -.09em; line-height: 1; }
      .editorial .hero-graphic small { margin-top: 10px; }
      .editorial .chart-line { stroke: var(--accent); }
      .editorial .donut::after { background: var(--surface); }
      .editorial .banner { border-radius: 2px; }
      .editorial .side nav .active { border-radius: 2px; }
      .editorial .grid-main { grid-template-columns: 1.25fr .75fr; }
      @media (max-width: 1080px) { .grid-main, .grid-bottom { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-bottom > :last-child { grid-column: 1 / -1; } .rank-item { grid-template-columns: 75px 1fr auto; } }
      @media (max-width: 760px) { .frame { display: block; } .side { display: none; } .main { padding: 24px 16px 38px; } .top { margin-bottom: 20px; } .top-right .pill { display: none; } .grid-main, .grid-bottom { grid-template-columns: 1fr; } .grid-bottom > :last-child { grid-column: auto; } .metric-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } .metric { padding: 10px; } .metric strong { font-size: 16px; } .hero { min-height: 0 !important; } .kpi { font-size: clamp(34px, 9vw, 54px); } .editorial .hero { grid-template-columns: 1fr; } .editorial .hero-graphic { display: none; } }
      @media (prefers-reduced-motion: no-preference) { .panel, .metric { transition: transform .22s ease, box-shadow .22s ease; } .panel:hover { transform: translateY(-3px); } .metric:hover { transform: translateY(-2px); } }
    </style>
  </head>
  <body>
    <header class="preview-bar">
      <div><strong>Money Journey · 视觉提案</strong><br /><small>选择一版，查看完整的家庭资金总览</small></div>
      <nav class="preview-links" aria-label="视觉方案">
        <a href="?style=orbit" data-style="orbit">01 深空指挥舱</a>
        <a href="?style=glass" data-style="glass">02 极光玻璃</a>
        <a href="?style=editorial" data-style="editorial">03 金融画报</a>
      </nav>
      <span class="preview-note">独立视觉预览 · 演示数据</span>
    </header>
    <div id="app"></div>
    <script>
      const style = new URLSearchParams(location.search).get('style');
      const theme = ['orbit', 'glass', 'editorial'].includes(style) ? style : 'orbit';
      document.querySelector(`[data-style="${theme}"]`).classList.add('active');
      const titles = { orbit: ['深空指挥舱', '把家庭资产变成一眼可读的实时驾驶舱'], glass: ['极光玻璃', '让日常理财像打开一件精致的数字产品'], editorial: ['金融画报', '用高对比的排版突出最关键的资金决策'] };
      const bars = [['工商银行', '42%', 42], ['招商银行', '31%', 31], ['建设银行', '18%', 18], ['其他银行', '9%', 9]];
      document.getElementById('app').innerHTML = `
        <div class="concept ${theme}"><div class="frame">
          <aside class="side"><div class="logo"><span class="mark">MJ</span>Money Journey</div><nav aria-label="页面结构"><span>▧　资金计算器</span><span class="active">◈　家庭资金总览</span><span>▤　资产记录</span><span>◷　导入与快照</span><span>♧　家庭成员</span></nav><div class="side-foot">演示视觉稿<br />数据仅用于比较版式与配色</div></aside>
          <main class="main"><div class="top"><div><div class="eyebrow">CONCEPT ${theme === 'orbit' ? '01' : theme === 'glass' ? '02' : '03'} / FAMILY FINANCE</div><h1>${titles[theme][0]}</h1><div class="sub">${titles[theme][1]}</div></div><div class="top-right"><span class="pill">●　演示数据</span><span class="avatar">MJ</span></div></div>
            <section class="panel hero" aria-label="家庭资产总额"><div class="hero-copy"><div class="eyebrow">FAMILY NET WORTH / 家庭资产总额</div><div class="kpi"><small>¥</small>1,280,000</div><div class="sub">近 6 个月资产分布与到期计划 · 示例数据</div>${theme === 'editorial' ? '' : '<div class="metric-row"><div class="metric"><span>资产记录</span><strong>15 笔</strong></div><div class="metric"><span>家庭成员</span><strong>3 位</strong></div><div class="metric"><span>未来半年到期</span><strong>74 万</strong></div></div>'}</div>${theme === 'editorial' ? '<div class="hero-graphic"><span>THE BIG PICTURE</span><strong>128<span style="font-size:.4em">万</span></strong><small>让资金安排看得见。</small></div>' : ''}</section>
            ${theme === 'editorial' ? '<div class="metric-row" style="margin:16px 0"><div class="metric"><span>资产记录</span><strong>15 笔</strong></div><div class="metric"><span>家庭成员</span><strong>3 位</strong></div><div class="metric"><span>未来半年到期</span><strong>74 万</strong></div></div>' : ''}
            <div class="grid-main"><section class="panel panel-pad"><div class="panel-head"><div><h2>资金走势</h2><span>月度资金快照 · 示意曲线</span></div><span>过去 6 个月 ↗</span></div><svg class="chart-svg" viewBox="0 0 640 215" role="img" aria-label="资金走势示意图"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity=".28"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><path d="M25 44H620M25 89H620M25 134H620M25 179H620" stroke="currentColor" opacity=".1"/><path d="M28 152 C85 146 110 166 166 137 S249 149 303 105 S385 120 438 82 S522 92 602 42 L602 182 L28 182Z" fill="url(#area)" style="color:var(--accent)"/><path class="chart-line" d="M28 152 C85 146 110 166 166 137 S249 149 303 105 S385 120 438 82 S522 92 602 42" fill="none" stroke-width="4" stroke-linecap="round"/><circle cx="602" cy="42" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="4"/><g class="chart-axis"><text x="20" y="208">6月</text><text x="134" y="208">7月</text><text x="248" y="208">8月</text><text x="360" y="208">9月</text><text x="468" y="208">10月</text><text x="582" y="208">11月</text></g></svg><div class="legend"><span><i class="dot"></i>家庭总资产</span><span>当前 ¥ 1,280,000</span></div></section>
              <section class="panel panel-pad"><div class="panel-head"><div><h2>银行分布</h2><span>存放在哪些银行</span></div><span>04 BANKS</span></div><div class="rank">${bars.map(([name, percent, width]) => `<div class="rank-item"><span>${name}</span><div class="track"><div class="fill" style="width:${width * 2.2}%"></div></div><strong>${percent}</strong></div>`).join('')}</div><div class="banner"><span>最多资金集中于工商银行</span><strong>42%</strong></div></section></div>
            <div class="grid-bottom"><section class="panel panel-pad"><div class="panel-head"><div><h2>资产类别</h2><span>储蓄、理财和其他配置</span></div><span>占比</span></div><div class="donut" role="img" aria-label="资产类别占比示意图"></div><div class="legend"><span><i class="dot"></i>储蓄 45%</span><span><i class="dot" style="background:var(--accent2)"></i>理财 31%</span><span><i class="dot" style="background:var(--accent3)"></i>其他 24%</span></div></section>
              <section class="panel panel-pad"><div class="panel-head"><div><h2>未来半年到期</h2><span>按月查看到期现金流</span></div><span>6 个月</span></div><div class="maturity"><div><i style="--h:34px"></i><small>11月</small></div><div><i style="--h:116px"></i><small>12月</small></div><div><i style="--h:62px"></i><small>1月</small></div><div><i style="--h:88px"></i><small>2月</small></div><div><i style="--h:5px"></i><small>3月</small></div><div><i style="--h:133px"></i><small>4月</small></div></div></section>
              <section class="panel panel-pad"><div class="panel-head"><div><h2>家庭成员</h2><span>成员资产结构</span></div><span>3 位</span></div><div class="member-list"><div class="member"><b>张</b>张三<span>¥ 58 万</span></div><div class="member"><b>李</b>李四<span>¥ 45 万</span></div><div class="member"><b>王</b>王五<span>¥ 25 万</span></div></div><div class="member-strip" aria-label="成员资产比例"><i></i><i></i><i></i></div></section></div>
            <div class="banner"><strong>当前是静态视觉提案，所有金额均为演示数据。</strong><span>正式页面保持原样 · 可通过顶部切换三版</span></div>
          </main>
        </div></div>`;
    </script>
  </body>
</html>
