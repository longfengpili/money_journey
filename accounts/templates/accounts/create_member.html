{% extends 'base.html' %}
{% block title %}创建家庭成员{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 540px;">
    <div class="card-body">
        <h1 class="h4">创建家庭成员</h1>
        <p>创建后即可为该成员录入资产。需要登录时，由系统维护人员为其设置密码。</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">创建成员</button>
        </form>
    </div>
</div>
{% endblock %}
